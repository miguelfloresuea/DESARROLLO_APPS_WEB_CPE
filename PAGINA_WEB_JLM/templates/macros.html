{% macro tarjeta_plan(plan) %}
<div class="col-md-6 col-lg-3 mb-4">
    <div class="card h-100 custom-card text-center">
        <div class="card-body">
            <h5 class="card-title text-primary">{{ plan.nombre }}</h5>
            <p class="card-text mb-1"><strong>{{ plan.velocidad }}</strong></p>
            <p class="card-text fs-4 mb-1">{{ plan.precio }} <small class="text-muted">/mes</small></p>
            <p class="card-text">{{ plan.descripcion }}</p>
        </div>
    </div>
</div>
{% endmacro %}
